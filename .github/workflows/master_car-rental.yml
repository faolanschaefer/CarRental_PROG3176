# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - car-rental

# Run workflow on push to master branch or with a manual trigger
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Build stage: build and compile th project
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      # Check out the git branch
      - uses: actions/checkout@v4

      # Set up dotnet 10 environment
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Compile project files
      - name: Build with dotnet
        run: dotnet build Maintenance.WebAPI/Maintenance.WebAPI.csproj --configuration Release

      # Create a deployable package
      - name: dotnet publish
        run: dotnet publish Maintenance.WebAPI/Maintenance.WebAPI.csproj -c Release -o ${{env.DOTNET_ROOT}}/carrental-maintenance

      # Save the package to GitHub
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/carrental-maintenance

  # Deploy stage: deploy the service to Azure
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      # Get the files generated in the build stage
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # Default Azure authentication - somehow my secret files got mixed up and I couldn't generate new keys
      # - name: Login to Azure
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_77FECDA6FA3E481AA9ED451AD33E0226 }}
      #     tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_456BDCCD14A444E1A699589FBBFC5A36 }}
      #     subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9AD9CE4FC9CE46C58629126802852516 }}

      # Deploy the service to the 'maintenance-webapi' app in Azure using the less secure publish profile authentication
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'maintenance-webapi'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

          






