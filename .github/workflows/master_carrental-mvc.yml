# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - carrental-mvc

# Run workflow on push to master branch or with a manual trigger
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Build stage: build and compile th project
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      # Check out the git branch
      - uses: actions/checkout@v4 

      # Set up dotnet 10 environment
      - name: Set up .NET Core 
        uses: actions/setup-dotnet@v4 
        with:
          dotnet-version: '10.x'

      # Compile project files
      - name: Build with dotnet
        run: dotnet build CarRental.MVC/CarRental.MVC.csproj --configuration Release

      # Create a deployable package
      - name: dotnet publish
        run: dotnet publish CarRental.MVC/CarRental.MVC.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      # Save the package to GitHub
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  # Deploy stage: deploy the service to Azure
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      # Get the files generated in the build stage
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # Authenticate with Azure credentials using GitHub Actions secrets
      # - name: Login to Azure
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_185D15B4D606487682827CED91E4E31C }}
      #     tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A39D0B3981004D67BD1935845630680F }}
      #     subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E512F122AF164044899A6C45FB8754A8 }}

      # Deploy the service to the 'carrental-mvc' app in Azure using the less secure publish profile authentication
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carrental-mvc'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_MVCAPP_PUBLISH_PROFILE }}
          package: .

          


