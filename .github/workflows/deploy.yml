name: Build, Push, and Deploy to AKS

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  USERNAME: faolanschaefer

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ── Build & push all service images in parallel ──────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: carrental-gateway
            context: CarRental.Gateway
          - service: carrental-mvc
            context: CarRental.MVC
          - service: customerprofile-webapi
            context: CustomerProfile.WebAPI
          - service: maintenance-webapi
            context: Maintenance.WebAPI
          - service: vehicleinventory-webapi
            context: VehicleInventory.WebAPI

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Probe token access (repo endpoint)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -i -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }} | sed -n '1,40p'

      # Log in to GHCR using the workflow's GITHUB_TOKEN — no secret needed
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root is required as context — Dockerfiles copy across project boundaries
          context: .
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # ── Deploy to AKS after all images are pushed ────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate with Azure via OIDC (no long-lived credentials stored)
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fetch credentials for the AKS cluster and configure kubectl
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # Apply the full manifest (Services, Deployments, ServiceAccount)
      - name: Apply k8s manifests
        run: kubectl apply -f k8s-manifests.yaml

      # Force pods to pull the new 'latest' image — needed because the tag itself doesn't change
      - name: Rollout restart all deployments
        run: |
          kubectl rollout restart deployment/carrental-gateway
          kubectl rollout restart deployment/carrental-mvc
          kubectl rollout restart deployment/customerprofile-webapi
          kubectl rollout restart deployment/maintenance-webapi
          kubectl rollout restart deployment/vehicleinventory-webapi

      # Block until every deployment finishes rolling out (or times out)
      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/carrental-gateway    --timeout=120s
          kubectl rollout status deployment/carrental-mvc         --timeout=120s
          kubectl rollout status deployment/customerprofile-webapi --timeout=120s
          kubectl rollout status deployment/maintenance-webapi     --timeout=120s
          kubectl rollout status deployment/vehicleinventory-webapi --timeout=120s
